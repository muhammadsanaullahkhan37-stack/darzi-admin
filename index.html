<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Darzi Khata Admin</title>
<style>
  body{font-family:Arial,sans-serif;background:#FDF6EC;margin:0;color:#1E2A27}
  .wrap{max-width:760px;margin:0 auto;padding:16px}
  h1{color:#0F5C4D;font-size:22px}
  input,select,button{font-size:16px;padding:12px;border-radius:12px;border:1px solid #ccc;width:100%;box-sizing:border-box;margin-top:10px}
  button{background:#0F5C4D;color:#fff;border:0;cursor:pointer}
  button.small{width:auto;padding:8px 14px;font-size:14px;margin:8px 8px 0 0}
  button.gray{background:#7F8C8D}
  .card{background:#fff;border-radius:16px;padding:14px;margin-top:12px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
  .card.unread{border-left:6px solid #C9A24D}
  .meta{font-size:13px;color:#666;margin-top:4px}
  .msg{white-space:pre-wrap;margin-top:8px}
  .tag{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;color:#fff}
  .masla{background:#C0392B}.mashwara{background:#2E86C1}.tareef{background:#27AE60}
  .err{color:#C0392B;margin-top:10px}
  .hide{display:none}
  .bar{display:flex;gap:8px;align-items:center;justify-content:space-between}
</style>
</head>
<body>
<div class="wrap">
  <h1>Darzi Khata Admin</h1>

  <div id="loginBox" class="card">
    <input id="email" type="email" placeholder="Email" autocomplete="username">
    <input id="pass" type="password" placeholder="Password" autocomplete="current-password">
    <button id="loginBtn">Login</button>
    <div id="loginErr" class="err"></div>
  </div>

  <div id="app" class="hide">
    <div class="bar">
      <div id="who" class="meta"></div>
      <button id="logoutBtn" class="small gray">Logout</button>
    </div>
    <select id="filter">
      <option value="all">Sab</option>
      <option value="unread">Na-padhe</option>
      <option value="masla">Masla</option>
      <option value="mashwara">Mashwara</option>
      <option value="tareef">Tareef</option>
    </select>
    <div id="count" class="meta"></div>
    <div id="list"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, collection, query, orderBy, limit, onSnapshot, doc, updateDoc, deleteDoc }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD1lB49TrdyJXc6Id5nero8zd06xsZdSZw",
  authDomain: "darzi-khata-2c5aa.firebaseapp.com",
  projectId: "darzi-khata-2c5aa",
  storageBucket: "darzi-khata-2c5aa.firebasestorage.app",
  messagingSenderId: "1050169581894",
  appId: "1:1050169581894:web:d820b2597fb4ebbe978547"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = id => document.getElementById(id);
let items = [];
let unsub = null;

$("loginBtn").onclick = async () => {
  $("loginErr").textContent = "";
  try {
    await signInWithEmailAndPassword(auth, $("email").value.trim(), $("pass").value);
  } catch (e) {
    $("loginErr").textContent = "Login nahi hua: " + e.code;
  }
};
$("logoutBtn").onclick = () => signOut(auth);
$("filter").onchange = render;

onAuthStateChanged(auth, user => {
  if (unsub) { unsub(); unsub = null; }
  if (!user) {
    $("loginBox").classList.remove("hide");
    $("app").classList.add("hide");
    return;
  }
  $("loginBox").classList.add("hide");
  $("app").classList.remove("hide");
  $("who").textContent = user.email;
  const q = query(collection(db, "feedback"), orderBy("created", "desc"), limit(200));
  unsub = onSnapshot(q, snap => {
    items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  }, err => {
    $("list").innerHTML = '<div class="card err">Feedback nahi khul saki (' + err.code +
      '). Agar permission-denied hai to Firestore rules mein admin UID check karein.</div>';
  });
});

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function render() {
  const f = $("filter").value;
  const shown = items.filter(i =>
    f === "all" ? true : f === "unread" ? !i.read : i.type === f);
  $("count").textContent = shown.length + " paigham (kul " + items.length + ")";
  $("list").innerHTML = shown.map(i => {
    const when = i.created && i.created.toDate ? i.created.toDate().toLocaleString() : "";
    const cls = ["masla", "mashwara", "tareef"].includes(i.type) ? i.type : "mashwara";
    return '<div class="card ' + (i.read ? "" : "unread") + '">' +
      '<span class="tag ' + cls + '">' + esc(i.type) + '</span>' +
      '<div class="meta">' + esc(i.shop) + ' | ' + esc(i.email) + ' | v' + esc(i.version) + ' | ' + esc(when) + '</div>' +
      '<div class="msg">' + esc(i.message) + '</div>' +
      '<button class="small" data-read="' + i.id + '">' + (i.read ? "Na-padha karein" : "Padha hua") + '</button>' +
      '<button class="small gray" data-del="' + i.id + '">Delete</button>' +
      '</div>';
  }).join("");
}

$("list").onclick = async e => {
  const r = e.target.dataset.read, d = e.target.dataset.del;
  if (r) {
    const it = items.find(x => x.id === r);
    await updateDoc(doc(db, "feedback", r), { read: !it.read });
  }
  if (d && confirm("Yeh paigham delete karein?")) {
    await deleteDoc(doc(db, "feedback", d));
  }
};
</script>
</body>
</html>
